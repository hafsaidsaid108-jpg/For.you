<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;0,600;1,500&family=Poppins:wght@200;300;400;500&display=swap');

  :root{
    --bg-deep:#0b0710;
    --bg-mid:#1b0f18;
    --bg-warm:#2a1420;
    --rose:#e9536b;
    --rose-soft:#f27d8f;
    --gold:#d8b077;
    --cream:#f6ece0;
    --muted:#b79aa2;
  }

  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background: radial-gradient(ellipse at 50% 20%, var(--bg-warm) 0%, var(--bg-mid) 45%, var(--bg-deep) 100%);
    overflow:hidden;
    font-family:'Poppins', sans-serif;
    color:var(--cream);
  }

  #stage{
    position:relative;
    width:100vw; height:100vh;
    display:flex; align-items:center; justify-content:center;
  }

  /* ambient glowing particles - background bokeh, always present */
  .bokeh{
    position:absolute;
    border-radius:50%;
    filter: blur(2px);
    pointer-events:none;
    opacity:0;
    animation: bokeh-drift linear infinite, bokeh-fade 6s ease-in-out infinite;
  }
  @keyframes bokeh-drift{
    from{ transform: translateY(0) translateX(0); }
    to{ transform: translateY(-120vh) translateX(20px); }
  }
  @keyframes bokeh-fade{
    0%,100%{ opacity:0; }
    50%{ opacity:.55; }
  }

  /* countdown */
  #countdown{
    position:absolute;
    font-family:'Cormorant Garamond', serif;
    font-weight:500;
    font-size: clamp(6rem, 22vw, 13rem);
    color: var(--cream);
    text-shadow: 0 0 40px rgba(233,83,107,.55), 0 0 90px rgba(216,176,119,.25);
    opacity:0;
    transform: scale(.4);
    letter-spacing:2px;
  }
  #countdown.show{
    animation: pop-in 0.9s cubic-bezier(.19,1,.22,1) forwards;
  }
  @keyframes pop-in{
    0%{ opacity:0; transform: scale(.35); filter: blur(6px); }
    55%{ opacity:1; transform: scale(1.08); filter: blur(0); }
    100%{ opacity:0; transform: scale(1.35); filter: blur(2px); }
  }

  /* content wrapper: message + photo */
  #content{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 4.5rem;
    max-width: 1100px;
    width:92%;
    opacity:0;
  }
  #content.reveal{ opacity:1; }

  #message{
    flex: 1 1 380px;
    max-width: 520px;
    opacity:0;
    transform: translateY(18px);
    text-align:left;
  }
  #message.show{
    animation: msg-in 1.6s cubic-bezier(.16,.8,.24,1) forwards;
  }
  @keyframes msg-in{
    to{ opacity:1; transform:translateY(0); }
  }

  .eyebrow{
    font-family:'Poppins', sans-serif;
    font-weight:300;
    letter-spacing: 4px;
    text-transform:uppercase;
    font-size: .68rem;
    color: var(--gold);
    margin: 0 0 1.1rem 0;
    opacity:.85;
  }

  #message p{
    font-family:'Cormorant Garamond', serif;
    font-weight:500;
    font-style:italic;
    font-size: clamp(1.7rem, 3.6vw, 2.7rem);
    line-height:1.35;
    margin:0;
    color: var(--cream);
  }

  #message .heart{
    color: var(--rose);
    font-style:normal;
    text-shadow: 0 0 18px rgba(233,83,107,.7);
  }

  #photo-card{
    flex: 0 1 340px;
    opacity:0;
    transform: translateX(70px) rotate(2deg);
    border-radius: 22px;
    overflow:hidden;
    position:relative;
  }
  #photo-card.show{
    animation: photo-in 1.4s cubic-bezier(.19,1,.22,1) forwards;
  }
  @keyframes photo-in{
    to{ opacity:1; transform: translateX(0) rotate(0deg); }
  }

  #photo-card .frame{
    position:relative;
    border-radius:22px;
    padding: 8px;
    background: linear-gradient(160deg, rgba(216,176,119,.55), rgba(233,83,107,.4));
    box-shadow:
      0 25px 60px -15px rgba(0,0,0,.65),
      0 0 0 1px rgba(255,255,255,.04);
  }
  #photo-card img{
    display:block;
    width:100%;
    height:auto;
    border-radius:16px;
    box-shadow: inset 0 0 40px rgba(0,0,0,.15);
  }
  #photo-card .glow-ring{
    position:absolute;
    inset:-2px;
    border-radius:24px;
    padding:2px;
    background: linear-gradient(120deg, var(--gold), var(--rose), var(--gold));
    background-size: 200% 200%;
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    animation: ring-shift 6s linear infinite;
    opacity:.8;
  }
  @keyframes ring-shift{
    0%{ background-position: 0% 50%; }
    100%{ background-position: 200% 50%; }
  }

  /* floating hearts, appear only after message */
  .float-heart{
    position:absolute;
    bottom:-40px;
    color: var(--rose-soft);
    opacity:0;
    pointer-events:none;
    font-size: 1.2rem;
    filter: drop-shadow(0 0 6px rgba(233,83,107,.6));
    animation: heart-rise linear forwards;
  }
  @keyframes heart-rise{
    0%{ opacity:0; transform: translateY(0) translateX(0) scale(.8) rotate(0deg); }
    10%{ opacity:.85; }
    90%{ opacity:.6; }
    100%{ opacity:0; transform: translateY(-100vh) translateX(var(--drift,30px)) scale(1.1) rotate(20deg); }
  }

  /* sound toggle */
  #sound-toggle{
    position:absolute;
    bottom: 26px;
    right: 26px;
    width:48px; height:48px;
    border-radius:50%;
    border:1px solid rgba(246,236,224,.25);
    background: rgba(20,10,16,.55);
    backdrop-filter: blur(6px);
    color: var(--cream);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    opacity:0;
    transition: opacity .8s ease, border-color .3s ease, transform .2s ease;
    z-index:5;
  }
  #sound-toggle.show{ opacity:1; }
  #sound-toggle:hover{ border-color: var(--rose); transform: scale(1.06); }
  #sound-toggle svg{ width:20px; height:20px; }

  @media (max-width: 760px){
    #content{
      flex-direction:column;
      gap: 2.2rem;
      text-align:center;
    }
    #message{ text-align:center; max-width: 90%; }
    #photo-card{ flex-basis:auto; width: 78%; max-width:320px; }
    .eyebrow{ letter-spacing:3px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>

<div id="stage">
  <div id="countdown"></div>

  <div id="content">
    <div id="message">
      <p class="eyebrow">A small pause, just for you</p>
      <p>Just wanted to remind you&hellip; you're special to me. <span class="heart">&#10084;</span></p>
    </div>
    <div id="photo-card">
      <div class="frame">

  el.style.boxShadow = '0 0 '+(size*3)+'px '+bokehColors[Math.floor(Math.random()*bokehColors.length)];
  const dur = 14 + Math.random()*18;
  el.style.animationDuration = dur+'s, '+(4+Math.random()*4)+'s';
  el.style.animationDelay = (-Math.random()*dur)+'s, '+(-Math.random()*6)+'s';
  stage.appendChild(el);
}

// ---------- countdown sequence ----------
const countdownEl = document.getElementById('countdown');
const sequence = ['3','2','1'];
let step = 0;

function showNext(){
  if(step < sequence.length){
    countdownEl.textContent = sequence[step];
    countdownEl.classList.remove('show');
    // force reflow to restart animation
    void countdownEl.offsetWidth;
    countdownEl.classList.add('show');
    step++;
    setTimeout(showNext, 950);
  } else {
    countdownEl.style.display = 'none';
    revealMessage();
  }
}

function revealMessage(){
  const content = document.getElementById('content');
  const message = document.getElementById('message');
  content.classList.add('reveal');
  message.classList.add('show');
  startHearts();
  fadeInSound();

  setTimeout(()=>{
    document.getElementById('photo-card').classList.add('show');
  }, 2000);
}

setTimeout(showNext, 500);

// ---------- floating hearts, start after message appears ----------
function startHearts(){
  function spawnHeart(){
    const h = document.createElement('div');
    h.className = 'float-heart';
    h.textContent = Math.random() > 0.4 ? '❤' : '♥';
    h.style.left = Math.random()*100+'vw';
    h.style.setProperty('--drift', (Math.random()*80-40)+'px');
    h.style.fontSize = (0.9 + Math.random()*1.3)+'rem';
    const dur = 9 + Math.random()*7;
    h.style.animationDuration = dur+'s';
    stage.appendChild(h);
    setTimeout(()=> h.remove(), dur*1000 + 200);
  }
  spawnHeart();
  setInterval(spawnHeart, 900);
}

// ---------- soft ambient music via Web Audio API ----------
let audioCtx = null;
let masterGain = null;
let playing = false;
let voices = [];

function buildAmbientMusic(){
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0;
  masterGain.connect(audioCtx.destination);

  // gentle reverb-ish tail via convolver (synthetic impulse)
  const convolver = audioCtx.createConvolver();
  const rate = audioCtx.sampleRate;
  const length = rate * 2.5;
  const impulse = audioCtx.createBuffer(2, length, rate);
  for(let c=0;c<2;c++){
    const data = impulse.getChannelData(c);
    for(let i=0;i<length;i++){
      data[i] = (Math.random()*2-1) * Math.pow(1 - i/length, 3);
    }
  }
  convolver.buffer = impulse;
  const wetGain = audioCtx.createGain();
  wetGain.gain.value = 0.35;
  convolver.connect(wetGain);
  wetGain.connect(masterGain);

  const dryGain = audioCtx.createGain();
  dryGain.gain.value = 0.7;
  dryGain.connect(masterGain);

  // soft chord pad, slowly evolving
  const notes = [220.00, 277.18, 329.63, 440.00]; // A3, C#4(approx via Db), E4, A4 -> warm A major-ish pad
  notes.forEach((freq, idx)=>{
    const osc = audioCtx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = freq;

    const lfo = audioCtx.createOscillator();
    lfo.frequency.value = 0.05 + idx*0.02;
    const lfoGain = audioCtx.createGain();
    lfoGain.gain.value = 3;
    lfo.connect(lfoGain);
    lfoGain.connect(osc.frequency);
    lfo.start();

    const gain = audioCtx.createGain();
    gain.gain.value = 0.0;
    const target = 0.05 + (idx===0?0.03:0);
    osc.connect(gain);
    gain.connect(dryGain);
    gain.connect(convolver);
    osc.start();

    voices.push({osc, gain, target});
  });
}

function fadeInSound(){
  document.getElementById('sound-toggle').classList.add('show');
}

function startAudio(){
  if(!audioCtx){ buildAmbientMusic(); }
  if(audioCtx.state === 'suspended'){ audioCtx.resume(); }
  const now = audioCtx.currentTime;
  masterGain.gain.cancelScheduledValues(now);
  masterGain.gain.setValueAtTime(masterGain.gain.value, now);
  masterGain.gain.linearRampToValueAtTime(0.5, now + 1.6);
  voices.forEach(v=>{
    v.gain.gain.cancelScheduledValues(now);
    v.gain.gain.setValueAtTime(v.gain.gain.value, now);
    v.gain.gain.linearRampToValueAtTime(v.target, now + 2.2);
  });
  playing = true;
}

function stopAudio(){
  if(!audioCtx) return;
  const now = audioCtx.currentTime;
  masterGain.gain.cancelScheduledValues(now);
  masterGain.gain.setValueAtTime(masterGain.gain.value, now);
  masterGain.gain.linearRampToValueAtTime(0, now + 1.0);
  playing = false;
}

const soundBtn = document.getElementById('sound-toggle');
const iconMuted = document.getElementById('icon-muted');
const iconUnmuted = document.getElementById('icon-unmuted');

soundBtn.addEventListener('click', ()=>{
  if(!playing){
    startAudio();
    iconMuted.style.display = 'none';
    iconUnmuted.style.display = 'block';
  } else {
    stopAudio();
    iconMuted.style.display = 'block';
    iconUnmuted.style.display = 'none';
  }
});
</script>
